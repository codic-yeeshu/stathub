# Example shape of the server Secret. Do NOT commit a populated copy.
# In CI the workflow creates this Secret from GitHub repo secrets via
# `kubectl create secret generic --from-literal=...`. For local manual
# work, copy this file, fill in the values, and apply with kubectl.
apiVersion: v1
kind: Secret
metadata:
  name: stathub-server-secrets
  namespace: stathub
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASS@HOST:5432/DBNAME"
  JWT_SECRET: "change-me"
  ARCJET_KEY: ""
  ARCJET_MODE: "DRY_RUN"
  RESEND_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  CLIENT_URL: "http://localhost:5173"
  CLIENT_PASSWORD_RESET_URL: "http://localhost:5173/reset-password"
